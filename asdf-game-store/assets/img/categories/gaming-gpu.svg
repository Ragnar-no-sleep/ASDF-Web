<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-Crypto Mining GPU RTX 4090" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-Crypto Mining GPU RTX 4090)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#00e5ff" filter="url(#glow)">
        <rect x="30" y="70" width="140" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="50" y="90" width="30" height="40" fill="currentColor" opacity="0.3"/><rect x="90" y="90" width="30" height="40" fill="currentColor" opacity="0.3"/><rect x="130" y="90" width="30" height="40" fill="currentColor" opacity="0.3"/><circle cx="160" cy="75" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#00e5ff" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>