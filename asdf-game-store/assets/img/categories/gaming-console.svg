<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-Blockchain Console Elite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8338ec;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#8338ec;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-Blockchain Console Elite)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#8338ec" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#8338ec" filter="url(#glow)">
        <rect x="50" y="80" width="100" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="80" cy="110" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="120" cy="110" r="8" fill="none" stroke="currentColor" stroke-width="2"/><rect x="90" y="95" width="20" height="8" fill="currentColor"/>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#8338ec" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>