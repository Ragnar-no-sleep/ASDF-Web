<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-Gaming Chair HODL" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff4757;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ff4757;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-Gaming Chair HODL)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#ff4757" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#ff4757" filter="url(#glow)">
        <rect x="60" y="70" width="80" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="3"/><rect x="70" y="130" width="60" height="30" fill="currentColor" opacity="0.3"/><line x1="90" y1="70" x2="90" y2="50" stroke="currentColor" stroke-width="3"/><line x1="110" y1="70" x2="110" y2="50" stroke="currentColor" stroke-width="3"/>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#ff4757" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>