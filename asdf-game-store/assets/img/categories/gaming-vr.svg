<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-VR Headset Metaverse Pro" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffa502;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ffa502;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-VR Headset Metaverse Pro)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#ffa502" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#ffa502" filter="url(#glow)">
        <ellipse cx="100" cy="110" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="75" cy="110" r="12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="125" cy="110" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 40 110 Q 30 110, 30 100" stroke="currentColor" stroke-width="3" fill="none"/><path d="M 160 110 Q 170 110, 170 100" stroke="currentColor" stroke-width="3" fill="none"/>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#ffa502" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>