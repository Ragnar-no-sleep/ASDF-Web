<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-ASDF NFT Game Bundle" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-ASDF NFT Game Bundle)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#ff006e" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#ff006e" filter="url(#glow)">
        <path d="M 100 50 L 140 90 L 120 140 L 80 140 L 60 90 Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="90" r="15" fill="currentColor" opacity="0.5"/><text x="100" y="100" text-anchor="middle" fill="currentColor" font-size="24" font-weight="bold">NFT</text>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#ff006e" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>