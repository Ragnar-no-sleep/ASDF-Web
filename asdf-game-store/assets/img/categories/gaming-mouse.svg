<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
    <defs>
        <linearGradient id="grad-Terminal Gaming Mouse" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.05" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="200" height="200" fill="#0a0e14"/>
    <rect width="200" height="200" fill="url(#grad-Terminal Gaming Mouse)"/>

    <!-- Grid pattern -->
    <path d="M 0 0 L 200 0 L 200 200 L 0 200 Z M 10 10 L 190 10 L 190 190 L 10 190 Z"
          fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.1"/>

    <!-- Icon -->
    <g color="#00ff88" filter="url(#glow)">
        <path d="M 70 80 Q 70 60, 100 60 Q 130 60, 130 80 L 130 140 Q 130 160, 100 160 Q 70 160, 70 140 Z" fill="none" stroke="currentColor" stroke-width="3"/><line x1="100" y1="60" x2="100" y2="100" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="85" r="5" fill="currentColor"/>
    </g>

    <!-- Terminal scanline -->
    <rect width="200" height="2" y="0" fill="#00ff88" opacity="0.1">
        <animate attributeName="y" from="-2" to="200" dur="4s" repeatCount="indefinite"/>
    </rect>
</svg>