  <body class="arcade-page">
    <!-- Neo Arcade Navigation -->
    <nav class="nav eco-page" role="navigation" aria-label="Games navigation">
      <div class="nav-content">
        <a href="/" class="nav-logo">
          <span class="nav-logo-icon">&#128293;</span>
          <span class="nav-logo-text">Ignition Arcade</span>
        </a>

        <div class="nav-tabs">
          <a href="#games" class="nav-tab active" data-hub-view="games">Games</a>
          <a href="#shop" class="nav-tab" data-hub-view="shop">Shop</a>
          <a href="#profile" class="nav-tab" data-hub-view="profile">Profile</a>
          <a href="#settings" class="nav-tab" data-hub-view="settings">Settings</a>
        </div>

        <div class="nav-right">
          <span id="user-badge" class="visitor-badge" role="status" aria-live="polite">VISITOR</span>
          <button id="wallet-btn" class="wallet-btn" aria-label="Connect Phantom wallet">
            <span id="wallet-btn-text">Connect Wallet</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- ============================================
         MAIN CONTENT
         ============================================ -->
    <main id="main-content" class="arcade-main" role="main">
      <!-- Background (Persistent) -->
      <div class="arcade-bg" aria-hidden="true">
        <div class="arcade-grid"></div>
        <div class="arcade-sun"></div>
        <div class="arcade-mountains"></div>
        <div class="arcade-glow"></div>
        <div class="arcade-shapes">
          <div class="shape shape-1"></div>
          <div class="shape shape-2"></div>
          <div class="shape shape-3"></div>
          <div class="shape shape-4"></div>
        </div>
        <div class="arcade-sidelines"></div>
        <div class="arcade-scanlines"></div>
        <div class="arcade-vignette"></div>
      </div>

      <!-- ============================================
             GAMES SECTION (Grid View) - DEFAULT
             ============================================ -->
      <section class="valhalla-section" id="games-section" aria-labelledby="games-section-title">
        <div class="container">
          <div class="valhalla-section-header">
            <h2 class="valhalla-section-title" id="games-section-title">
              <span class="icon" aria-hidden="true">🕹️</span>
              All Games
            </h2>
            <p class="valhalla-section-subtitle">11 unique mini-games. Play, earn XP, climb the leaderboards!</p>
          </div>

          <div class="games-grid" id="games-grid">
            <div class="loading-skeleton"><div class="skeleton-card"></div></div>
          </div>
        </div>
      </section>

      <!-- ============================================
             COSMETIC SHOP SECTION
             ============================================ -->
      <section class="valhalla-section section-hidden" id="shop-section" aria-labelledby="shop-section-title">
        <div class="container container-xl">
          <div class="valhalla-section-header">
            <h2 class="valhalla-section-title" id="shop-section-title">
              <span class="icon" aria-hidden="true">🛒</span>
              Cosmetic Shop
              <span class="valhalla-badge">NEW</span>
            </h2>
            <p class="valhalla-section-subtitle">Customize your ASDF Dog with unique cosmetics!</p>
          </div>

          <!-- Back to Hub -->
          <div class="mb-5">
            <button class="btn-valhalla-secondary" data-hub-back aria-label="Go back to Hub">
              ← Back to Hub
            </button>
          </div>

          <div id="shop-container"></div>
        </div>
      </section>

      <!-- ============================================
             PROFILE SECTION
             ============================================ -->
      <section class="valhalla-section section-hidden" id="profile-section" aria-labelledby="profile-section-title">
        <div class="container container-lg">
          <div class="valhalla-section-header">
            <h2 class="valhalla-section-title" id="profile-section-title">
              <span class="icon" aria-hidden="true">👤</span>
              Profile
            </h2>
            <p class="valhalla-section-subtitle">Your stats, achievements, and journey</p>
          </div>

          <!-- Back to Hub -->
          <div class="mb-5">
            <button class="btn-valhalla-secondary" data-hub-back aria-label="Go back to Hub">
              ← Back to Hub
            </button>
          </div>

          <div class="profile-container">
            <!-- Content dynamic via JS -->
          </div>
        </div>
      </section>

      <!-- ============================================
             SETTINGS SECTION
             ============================================ -->
      <section class="valhalla-section section-hidden" id="settings-section" aria-labelledby="settings-section-title">
        <div class="settings-container container">
          <div class="valhalla-section-header">
            <h2 class="valhalla-section-title" id="settings-section-title">
              <span class="icon" aria-hidden="true">⚙️</span>
              Settings
            </h2>
            <p class="valhalla-section-subtitle">Customize your experience</p>
          </div>

          <!-- Back to Hub -->
          <div class="mb-5">
            <button class="btn-valhalla-secondary" data-hub-back aria-label="Go back to Hub">
              ← Back to Hub
            </button>
          </div>

          <div class="settings-grid">
            <!-- Settings options dynamic via JS -->
          </div>
        </div>
      </section>
    </main>
