<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="view-transition" content="same-origin" />
    <title>Game of the Week | ASDF Ecosystem</title>
    <meta
      name="description"
      content="Play weekly games and compete for top scores. Token-gated gaming for $asdfasdfa holders."
    />
    <link rel="canonical" href="https://alonisthe.dev/games" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="css/design-tokens.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/games-arcade.css" />
    <link rel="stylesheet" href="css/valhalla.css" />
    <link rel="stylesheet" href="css/game-engines.css" />
    <link rel="stylesheet" href="css/runtime-components.css" />
  </head>
  <body class="arcade-page">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.8);color:white;z-index:9999;padding:10px;font-family:monospace;font-size:12px;';
        div.innerHTML = 'ENGINE CRASH: ' + msg + ' at ' + url + ':' + line;
        document.body.appendChild(div);
        return false;
      };
    </script>
    
    <nav class="nav eco-page">
      <div class="nav-content">
        <a href="/" class="nav-logo"> Ignition Arcade </a>
        <div class="nav-tabs">
          <a href="#games" class="nav-tab active">Games</a>
          <a href="#shop" class="nav-tab">Shop</a>
        </div>
        <div class="nav-right">
          <button id="wallet-btn" class="wallet-btn">Connect Wallet</button>
        </div>
      </div>
    </nav>

    <main id="main-content" class="arcade-main">
      <div class="arcade-bg">
        <div class="arcade-grid"></div>
      </div>

      <section class="valhalla-section" id="games-section">
        <div class="container">
          <div class="valhalla-section-header">
            <h2 class="valhalla-section-title">🕹️ All Games</h2>
            <p class="valhalla-section-subtitle">11 unique mini-games. Play, earn XP, climb the leaderboards!</p>
          </div>
          <div class="games-grid" id="games-grid">
            <div class="loading-skeleton"><div class="skeleton-card"></div></div>
          </div>
        </div>
      </section>

      <!-- Placeholder sections for navigation -->
      <section class="valhalla-section section-hidden" id="shop-section">
        <div class="container"><h2>🛒 Cosmetic Shop</h2><div id="shop-container"></div></div>
      </section>
      <section class="valhalla-section section-hidden" id="profile-section">
        <div class="container"><h2>👤 Profile</h2><div class="profile-container"></div></div>
      </section>
      <section class="valhalla-section section-hidden" id="settings-section">
        <div class="container"><h2>⚙️ Settings</h2><div class="settings-grid"></div></div>
      </section>
    </main>

    <div id="game-modals"></div>

    <!-- JAVASCRIPT: Load Order Critical (11/10 Standard) -->

    <script defer src="js/games/framework/Kernel.js"></script>
    <script defer src="js/games/core/AssetPipeline.js"></script>
    <script defer src="js/games/core/SoundPlugin.js"></script>
    <script defer src="js/games/core/ScoreService.js"></script>
    <script defer src="js/games/core/LeaderboardPlugin.js"></script>
    <script defer src="js/games/shared/InputHub.js"></script>

    <script defer src="js/games/shared/events.js"></script>

    <script defer src="js/games/core/systems/InputSystem.js"></script>
    <script defer src="js/games/framework/GameInstance.js"></script>

    <!-- 6. Coordinator & Main Entry -->
    <script defer src="js/games/engines/index.js"></script>
    <script defer src="js/games/main.js"></script>

    <!-- 7. Integration & Hubs -->
    <script defer src="js/games/arcade-hub.js"></script>
