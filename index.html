                 Orbit: F9=34s radius: F12=144px
                 delay = -(angle/360 * 34)s
                 ================================================ -->

            <!-- Burns — 0° → delay: 0s -->
            <a href="/burns"
               class="hub-orbit-item"

               style="--orbit-delay: 0s; --static-angle: 0deg;"
