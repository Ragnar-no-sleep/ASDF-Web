# Simple Deployment to GitHub Pages for Vite
# 
# 1. Update your vite.config.js to include: base: '/ASDF-Web/'
# 2. Run: npm run build
# 3. Create a folder named 'deploy-temp' and copy 'dist' content there
# 4. Push 'deploy-temp' to a 'gh-pages' branch
# 
# OR use this automated Workflow:

name: Deploy to GitHub Pages

on:
  push:
    branches: [ develop ] # Adjust to your main branch if needed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
