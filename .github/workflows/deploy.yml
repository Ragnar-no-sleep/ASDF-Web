# ASDF-Web Deployment
# Deploys to Render on merge to main
# Philosophy: Don't panic. Hold.

name: Deploy

on:
  push:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # ============================================
  # Pre-deploy verification
  # ============================================
  verify:
    name: 🔍 Pre-deploy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm install (not npm ci) to handle platform-specific optional deps
        # package-lock.json generated on Windows omits @rollup/rollup-linux-x64-gnu
        run: npm install

      - name: Run all tests
        run: npm test

      - name: Security audit
        # --omit=dev: only audit production dependencies
        # --audit-level=critical: @solana/spl-token has known high vuln in bigint-buffer
        # with no non-breaking fix available (GHSA-3gc7-fjrx-p6mg)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build check
        run: npm run build --if-present

  # ============================================
  # Deploy to Render
  # ============================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://asdf-web.onrender.com

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploying ASDF-Web to Render..."
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — relying on Render auto-deploy"
            echo "Set this secret to enable explicit deploy triggers"
          else
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            if [ "$response" = "200" ] || [ "$response" = "201" ]; then
              echo "Deploy hook triggered successfully (HTTP $response)"
            else
              echo "::warning::Deploy hook returned HTTP $response"
            fi
          fi

      - name: Health check (with retry)
        run: |
          URL="https://hub.alonisthe.dev/health"
          MAX_RETRIES=5
          WAIT=30

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES (waiting ${WAIT}s)..."
            sleep $WAIT
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Got HTTP $code, retrying..."
            WAIT=$((WAIT + 30))
          done

          echo "::warning::Health check did not return 200 after $MAX_RETRIES attempts"
          echo "Render may still be deploying — check dashboard manually"

  # ============================================
  # Post-deploy notification
  # ============================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deploy result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo ""
            echo "🔗 Live at: https://asdf-web.onrender.com"
            echo ""
            echo "This is fine. 🐕‍🦺🔥"
          else
            echo "❌ Deployment failed"
            echo "Check the logs above for details"
          fi
